[project]
name = "rigol-tool"
version = "0.1.0"
description = "Automated USB acquisition for RIGOL DS1000E-series oscilloscopes"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "matplotlib>=3.10",
  "numpy>=2.2",
  "pyusb>=1.3",
  "pyvisa>=1.15",
  "pyvisa-py>=0.8",
]

[project.scripts]
rigol = "rigol_tool.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rigol_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
